# render.yaml  – single-service deployment on Render.com (free tier)
services:
  - type: web
    name: campusguard-ai
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        value: sqlite:///campusguard.db   # swap to a Postgres URL for production
    staticPublishPath: ../frontend        # serves the frontend at /
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
